
services:
  incubator-postgres:
    image: postgres:latest
    container_name: incubator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incubator}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/docker,
      # so mount the parent directory rather than /var/lib/postgresql/data.
      - incubator-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  reverse-proxy:
    image: caddy:2-alpine
    container_name: market-proxy
    restart: unless-stopped

    # Routing lives in caddy/Caddyfile.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8090}
      S3_BUCKET: ${S3_BUCKET:-media}
      FRONTEND_MODE: ${FRONTEND_MODE:-dev}
      # The Expo dev server runs on the host (so phones can reach Metro). With Docker Desktop +
      # WSL, host.docker.internal is the Windows host, so set FRONTEND_UPSTREAM to an address
      # where the WSL-side Expo server is reachable (e.g. the WSL eth0 IP) if you get 502s on /.
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROXY_PORT:-8080}:8080"
      # Production (SITE_ADDRESS=<domain>) serves https on 80/443 instead:
      # - "80:80"
      # - "443:443"
      # - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates; must persist or Let's Encrypt rate-limits you
      - caddy-config:/config
      # FRONTEND_MODE=static: serve the web build (`npx expo export` in frontend/).
      # - ./frontend/dist:/srv:ro

  incubator-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: incubator-tunnel
    restart: unless-stopped
    # cloudflared reads the token from TUNNEL_TOKEN, so it never appears in the process args.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # In the Cloudflare dashboard, point the tunnel's public hostname at http://reverse-proxy:8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - reverse-proxy

volumes:
  incubator-postgres-data:
  caddy-data:
  caddy-config:
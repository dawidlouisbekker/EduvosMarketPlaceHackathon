openapi: 3.0.3
info:
  title: EduvosMarket API
  version: 1.0.0
  description: |
    EduvosMarket backend. Currently provides authentication only (Microsoft Entra ID).

    **Authentication.** Sign-in is Microsoft Entra ID (Eduvos tenant only), driven by the backend.
    * Web: navigate the browser to `GET /auth/login`. The backend sets an HttpOnly session cookie.
      Cookie-authenticated POST/PATCH/DELETE requests must carry an `Origin` header equal to the
      site origin (browsers do this automatically for same-origin `fetch`).
    * Native app: open `GET /auth/login?client=app&redirect_uri=…&code_challenge=…` with
      `WebBrowser.openAuthSessionAsync`, receive `?code=` on the redirect URI, then
      `POST /auth/app/exchange` to get a bearer token.

    **Errors** are JSON: `{ "error": "<code>", "message": "<text>" }`.
servers:
  - url: http://localhost:8080/api
    description: Local (docker compose)
security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: auth

paths:
  /health:
    get:
      tags: [auth]
      summary: Liveness and database check
      security: []
      responses:
        '200': { description: OK }

  # ------------------------------------------------------------------ auth
  /auth/login:
    get:
      tags: [auth]
      summary: Start Microsoft sign-in (redirects to Entra ID)
      description: |
        "Sign in with Microsoft" button target. If the student already has a Microsoft session in
        this browser they are signed in without typing anything. With `prompt=none` the attempt is
        silent: on failure the user is sent to `return_to?sso=unavailable` instead of seeing a
        Microsoft page. Use it once on first load to sign returning students in automatically.
      security: []
      parameters:
        - { name: return_to, in: query, schema: { type: string, example: /account }, description: Relative path to land on after sign-in (web only). }
        - { name: prompt, in: query, schema: { type: string, enum: [none] } }
        - { name: client, in: query, schema: { type: string, enum: [app] }, description: Native app flow. }
        - { name: redirect_uri, in: query, schema: { type: string, example: 'eduvosmarket://auth' }, description: Required for `client=app`; must be registered in APP_REDIRECT_URIS. }
        - { name: code_challenge, in: query, schema: { type: string }, description: 'Required for `client=app`: base64url(SHA-256(code_verifier)), 43 chars.' }
      responses:
        '303': { description: Redirect to Microsoft }
        '400': { $ref: '#/components/responses/Error' }
  /auth/callback:
    get:
      tags: [auth]
      summary: Entra ID redirect URI (not called by clients)
      description: |
        Web: sets the session cookie and redirects to `return_to` (or `return_to?auth_error=<code>`).
        App: redirects to `redirect_uri?code=<one-time code>` (or `?error=<code>`).
      security: []
      responses:
        '303': { description: Redirect }
  /auth/app/exchange:
    post:
      tags: [auth]
      summary: Exchange the app's one-time code for a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code: { type: string }
                code_verifier: { type: string }
      responses:
        '200':
          description: 'Session token (store in SecureStore, send as `Authorization: Bearer <token>`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: End this session (does not sign out of Microsoft)
      responses:
        '204': { description: Signed out }
  /me:
    get:
      tags: [auth]
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: __Host-session, description: '`session` when served over plain http (local dev).' }
    bearerAuth: { type: http, scheme: bearer, description: Token from /auth/app/exchange (native app). }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: not_found }
              message: { type: string }
  schemas:
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        is_admin: { type: boolean }

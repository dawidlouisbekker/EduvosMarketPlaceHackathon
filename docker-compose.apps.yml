services:

  backend:
    build: ./backend
    container_name: market-backend
    restart: unless-stopped
    init: true
    depends_on:
      market-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Secrets and settings come from backend/.env (template: backend/example.env).
    env_file:
      - path: ./backend/.env
        required: false
    # Container-specific values override backend/.env.
    environment:
      BIND: 0.0.0.0:8090
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@market-postgres:5432/${POSTGRES_DB:-entrepreneur_hub}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

  reverse-proxy:
    image: caddy:2-alpine
    container_name: market-proxy
    restart: unless-stopped
    depends_on:
      - backend
    # Routing lives in caddy/Caddyfile.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8090}
      S3_BUCKET: ${S3_BUCKET:-media}
      FRONTEND_MODE: ${FRONTEND_MODE:-dev}
      # The Expo dev server runs on the host (so phones can reach Metro). With Docker Desktop +
      # WSL, host.docker.internal is the Windows host, so set FRONTEND_UPSTREAM to an address
      # where the WSL-side Expo server is reachable (e.g. the WSL eth0 IP) if you get 502s on /.
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROXY_PORT:-8080}:8080"
      # Production (SITE_ADDRESS=<domain>) serves https on 80/443 instead:
      # - "80:80"
      # - "443:443"
      # - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates; must persist or Let's Encrypt rate-limits you
      - caddy-config:/config
      # FRONTEND_MODE=static: serve the web build (`npx expo export` in frontend/).
      # - ./frontend/dist:/srv:ro

volumes:
  caddy-data:
  caddy-config:

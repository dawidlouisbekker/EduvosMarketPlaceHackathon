services:

  backend:
    build: ./backend
    container_name: market-backend
    restart: unless-stopped
    init: true
    depends_on:
      market-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Secrets and settings come from backend/.env (template: backend/example.env).
    env_file:
      - path: ./backend/.env
        required: false
    # Container-specific values override backend/.env.
    environment:
      BIND: 0.0.0.0:8090
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@market-postgres:5432/${POSTGRES_DB:-entrepreneur_hub}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

